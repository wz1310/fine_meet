<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Video Conferencing Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="dark-theme">
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="logo-area">
            <div class="logo-icon">
              <span class="material-symbols-outlined">videocam</span>
            </div>
            <h1 class="logo-text">Connect</h1>
          </div>
          <nav class="nav-menu">
            <a href="#" class="nav-item active">
              <span class="material-symbols-outlined">home</span>
              <span class="nav-label">Home</span>
            </a>
            <a href="#" class="nav-item">
              <span class="material-symbols-outlined">chat_bubble</span>
              <span class="nav-label">Chat</span>
              <span class="badge">3</span>
            </a>
            <a href="#" class="nav-item">
              <span class="material-symbols-outlined">calendar_month</span>
              <span class="nav-label">Meetings</span>
            </a>
            <a href="#" class="nav-item">
              <span class="material-symbols-outlined">group</span>
              <span class="nav-label">Contacts</span>
            </a>
            <a href="#" class="nav-item">
              <span class="material-symbols-outlined">settings</span>
              <span class="nav-label">Settings</span>
            </a>
          </nav>
        </div>
        <div class="sidebar-bottom">
          <div class="user-profile">
            <!-- <div
              class="user-avatar"
              style="background-image: url('https://i.pravatar.cc/150?u=john')"
            ></div> -->
            <div class="user-info">
              <h4 class="user-name">User</h4>
              <p class="user-status">Dev Account</p>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-wrapper">
        <header class="top-header">
          <div class="search-container">
            <span class="material-symbols-outlined search-icon">search</span>
            <input
              type="text"
              placeholder="Search meetings, contacts..."
              class="search-input"
            />
          </div>
          <div class="header-actions">
            <button class="icon-btn">
              <span class="material-symbols-outlined">help</span>
            </button>
            <button class="icon-btn">
              <span class="material-symbols-outlined">notifications</span>
              <span class="notif-dot"></span>
            </button>
            <div class="divider"></div>
            <div class="status-indicator">
              <span class="material-symbols-outlined online"
                >fiber_manual_record</span
              >
              <span>Available</span>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="dashboard-grid">
            <section class="main-stats">
              <div class="hero-card">
                <div class="hero-content">
                  <div class="time-info">
                    <h2 class="date-text">Monday, October 24, 2023</h2>
                    <h1 class="time-text">
                      10:30 <span class="ampm">AM</span>
                    </h1>
                  </div>
                  <div class="meeting-id-box">
                    <div class="id-details">
                      <span class="id-label">Personal Meeting ID</span>
                      <span class="id-number">345-982-1102</span>
                    </div>
                    <button class="copy-btn">
                      <span class="material-symbols-outlined"
                        >content_copy</span
                      >
                    </button>
                  </div>
                </div>
              </div>

              <div class="action-grid">
                <button class="action-card">
                  <div class="action-icon-bg tinted">
                    <span class="material-symbols-outlined">add_box</span>
                  </div>
                  <div>
                    <h3>Join</h3>
                    <p>Join via ID</p>
                  </div>
                </button>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
